#   docker compose up -d postgres s3   -> infra only (run the API from Visual Studio)
#   docker compose up --build          -> everything (postgres/s3 run quietly: docker compose logs s3)
name: kyc

x-kyc-env: &kyc-env
  ConnectionStrings__Kyc: Host=postgres;Port=5432;Database=kyc;Username=kyc;Password=kyc;Gss Encryption Mode=Disable
  Storage__ServiceUrl: http://s3:8333
  # Pre-signed URLs are used from the host, so sign them for localhost.
  Storage__PublicServiceUrl: http://localhost:9000
  Storage__AccessKey: kyc-s3-access
  Storage__SecretKey: kyc-s3-secret-dev-only
  # Demo redeems lots of QR codes from one IP.
  RateLimits__HandoffRedeemPerMinute: "100"
  # Readable one-line logs locally. Production keeps JSON.
  Logging__Console__FormatterName: simple
  Logging__Console__FormatterOptions__SingleLine: "true"

services:
  postgres:
    image: postgres:17-alpine
    attach: false
    environment:
      POSTGRES_DB: kyc
      POSTGRES_USER: kyc
      POSTGRES_PASSWORD: kyc
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyc -d kyc"]
      interval: 3s
      retries: 20

  # S3-compatible store (MinIO no longer ships free images). Production would use AWS S3.
  s3:
    image: chrislusf/seaweedfs:3.97
    attach: false
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256
    ports: ["9000:8333"]
    volumes:
      - s3data:/data
      - ./deploy/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 3s
      retries: 30

  api:
    build: .
    environment:
      <<: *kyc-env
      Kyc__Roles: api
      Database__MigrateOnStartup: "true"
      Storage__EnsureBucketOnStartup: "true"
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      s3: { condition: service_healthy }

  worker:
    build: .
    environment:
      <<: *kyc-env
      Kyc__Roles: worker
      Database__MigrateOnStartup: "false"
      Storage__EnsureBucketOnStartup: "false"
      Partners__SeedOnStartup: "false"   # api seeds the dev partners
    depends_on:
      api: { condition: service_started }
    # docker compose up --scale worker=3
    deploy:
      replicas: 1

volumes:
  pgdata:
  s3data:
